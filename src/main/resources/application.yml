spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wayroc_chatbot?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  session:
    store-type: none
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:wayroc-chatbot-jwt-secret-key-at-least-32-chars}
  expire-seconds: 86400
wayroc:
  ai:
    rate-limit-per-second: 1